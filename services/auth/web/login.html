<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #201e1d;
    background: #f3f2f2;
  }

  main { width: 100%; max-width: 320px; }

  h1 { margin: 0 0 20px; font-size: 24px; }

  form { display: flex; flex-direction: column; }

  label { margin-bottom: 4px; font-size: 14px; }

  input {
    margin-bottom: 14px;
    padding: 10px;
    font: inherit;
    background: #fff;
    border: 1px solid #c9c7c7;
    border-radius: 2px;
  }
  input:focus-visible { border-color: #0088b0; outline: 1px solid #0088b0; }

  button {
    padding: 12px;
    font: inherit;
    color: #fff;
    background: #0088b0;
    border: 0;
    border-radius: 2px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }

  #message { min-height: 20px; font-size: 14px; color: #c2334d; }
  #message[data-ok] { color: #2e7d4f; }

  .foot { font-size: 14px; }
  a { color: #0088b0; }
</style>
</head>
<body>

<main>
  <h1>Вход</h1>

  <form id="form" novalidate>
    <label for="login">Логин</label>
    <input id="login" type="text" required autocomplete="username">

    <label for="password">Пароль</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button id="submit" type="submit">Войти</button>
  </form>

  <p id="message" role="alert" aria-live="polite"></p>

  <p class="foot">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</main>

<script>
// POST /auth/login {login, password} -> 200 + cookie token
"use strict";

const form = document.getElementById("form");
const submit = document.getElementById("submit");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!form.reportValidity()) return;

  submit.disabled = true;
  message.removeAttribute("data-ok");
  message.textContent = "";

  try {
    const response = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        login: document.getElementById("login").value.trim(),
        password: document.getElementById("password").value,
      }),
    });

    if (response.ok) {
      form.hidden = true;
      message.dataset.ok = "";
      message.textContent = "Вы вошли";
      // Со слэшем: маршрут объявлен как /users/, на /users gin ответил бы редиректом.
      location.assign("/users/");
      return;
    }

    message.textContent = await errorText(response);
  } catch {
    message.textContent = "Сервер недоступен";
  }

  submit.disabled = false;
});

// Сервер кладёт текст ошибки в "error"; у пустого тела его нет.
async function errorText(response) {
  try {
    const body = await response.json();
    const text = body["error"];
    if (typeof text === "string" && text) return text;
  } catch {}
  return "Ошибка " + response.status;
}
</script>

</body>
</html>
