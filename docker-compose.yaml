services:
  postgres_chat:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_chat:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_auth:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_notifications:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notifications_db
    ports:
      - "5436:5432"
    volumes:
      - pgdata_notifications:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  chat:
    build: ./
    depends_on:
      chat_migrator:
        condition: service_completed_successfully
      postgres_chat:
        condition: service_healthy
    environment:
      PORT: 8001
      DATABASE_URL: postgres://user:password@postgres_chat:5432/chat_db?sslmode=disable

  auth:
    build:
      context: .
      dockerfile: internal/auth/Dockerfile
    depends_on:
      auth_migrator:
        condition: service_completed_successfully
      postgres_chat:
        condition: service_healthy
    environment:
      PORT: 8002
      DATABASE_URL: postgres://user:password@postgres_auth:5432/auth_db?sslmode=disable

  chat_migrator:
    build:
      context: .
    entrypoint: ["./migrate"]
    restart: no
    depends_on:
      postgres_chat:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@postgres_chat:5432/chat_db?sslmode=disable

  auth_migrator:
    build:
      context: .
      dockerfile: ./internal/auth/Dockerfile
    entrypoint: ["./migrate"]
    restart: no
    depends_on:
      postgres_chat:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@postgres_auth:5432/auth_db?sslmode=disable

  nginx:
    image: nginx:alpine
    depends_on: [ chat ]
    ports:
      - "8081:80"
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

