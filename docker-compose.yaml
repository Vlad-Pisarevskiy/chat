services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  chat:
    build: ./
    depends_on:
      chat_migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PORT: 8001
      DATABASE_URL: postgres://user:password@postgres:5432/chat_db?sslmode=disable

  auth:
    build:
      context: .
      dockerfile: internal/auth/Dockerfile
    depends_on:
#      auth_migrator:
#        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PORT: 8002
      DATABASE_URL: postgres://user:password@postgres:5432/auth_db?sslmode=disable

  chat_migrator:
    build:
      context: .
    entrypoint: ["./migrate"]
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/chat_db?sslmode=disable

#  auth_migrator:
#    build: ./internal/auth/
#    entrypoint: ["./migrate"]
#    restart: no
#    depends_on:
#      postgres:
#        condition: service_healthy
#    environment:
#      DATABASE_URL: postgres://user:password@postgres:5432/auth_db?sslmode=disable

  nginx:
    image: nginx:alpine
    depends_on: [ chat ]
    ports:
      - "8081:80"
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
