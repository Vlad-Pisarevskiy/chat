syntax = "proto3";

package notify_service.v1;

option go_package = "chatflow/gen/notify_service/v1;notifyservicev1";

service NotifyService {
  rpc SendNotify(NotifyRequest) returns (NotifyResponse);
}

message NotifyRequest{
  int64 userID = 1;
  string title = 2;
  string preview = 3;
}

message NotifyResponse{
  bool send = 1;
}
