
server{
    listen 80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Картинка до 5 МБ вместе с полями формы. По умолчанию (1m) nginx сам
    # ответил бы на неё HTML-страницей 413; с этим лимитом 413 с JSON-телом
    # отдаёт сервер, а nginx останавливает только заведомо огромные тела.
    client_max_body_size 8m;

    error_page 413 @too_large;

    location @too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"error":"картинка больше 5 МБ"}';
    }

    location /{
        proxy_pass http://chat:8001;
    }

    location /register {
        proxy_pass http://auth:8002;
    }

    location /login {
        proxy_pass http://auth:8002;
    }

    location /auth/{
        proxy_pass http://auth:8002;
    }


    location /ws/{

        proxy_pass http://chat:8001;

        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }
}